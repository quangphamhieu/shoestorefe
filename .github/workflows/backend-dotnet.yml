name: .NET Backend Build & Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ShoeStore/**'
      - '.github/workflows/backend-dotnet.yml'
      - 'shoestorefe/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ShoeStore/ShoeStore.sln

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
    
    - name: Install Flutter dependencies
      run: |
        cd shoestorefe
        flutter pub get

    - name: Build Flutter Web
      run: |
        cd shoestorefe
        flutter build web --release --base-href /

    - name: Copy Flutter Web to wwwroot
      run: |
        mkdir -p ShoeStore/ShoeStore.API/wwwroot
        cp -r shoestorefe/build/web/* ShoeStore/ShoeStore.API/wwwroot/

    - name: Build .NET
      run: dotnet build ShoeStore/ShoeStore.sln --no-restore --configuration Release

    - name: Publish
      run: dotnet publish ShoeStore/ShoeStore.sln --configuration Release --output ./publish

    # Install LFTP to handle app_offline.htm (Stop/Start App)
    - name: Install LFTP
      id: install_lftp
      run: sudo apt-get update && sudo apt-get install -y lftp

    # 1. Stop App: Upload app_offline.htm
    - name: Stop App (Upload app_offline.htm)
      run: |
        echo "<html><head><title>Updating</title></head><body><h1>Website is updating...</h1></body></html>" > app_offline.htm
        lftp -c "set ssl:verify-certificate no; open -u ${{ secrets.MONSTER_ASP_FTP_USERNAME }},${{ secrets.MONSTER_ASP_FTP_PASSWORD }} ${{ secrets.MONSTER_ASP_FTP_SERVER }}; cd wwwroot; put app_offline.htm; bye"

    # 2. Deploy Files (Using LFTP for better stability/SSL handling)
    - name: Deploy to MonsterASP (LFTP)
      run: |
        lftp -c "set ssl:verify-certificate no; open -u ${{ secrets.MONSTER_ASP_FTP_USERNAME }},${{ secrets.MONSTER_ASP_FTP_PASSWORD }} ${{ secrets.MONSTER_ASP_FTP_SERVER }}; cd wwwroot; mirror -R -v -P 2 --overwrite --ignore-time --parallel=2 ./publish/ .; bye"

    # 3. Start App: Delete app_offline.htm
    - name: Start App (Delete app_offline.htm)
      if: always() && steps.install_lftp.outcome == 'success'
      run: |
        lftp -c "set ssl:verify-certificate no; open -u ${{ secrets.MONSTER_ASP_FTP_USERNAME }},${{ secrets.MONSTER_ASP_FTP_PASSWORD }} ${{ secrets.MONSTER_ASP_FTP_SERVER }}; cd wwwroot; rm app_offline.htm; bye"
