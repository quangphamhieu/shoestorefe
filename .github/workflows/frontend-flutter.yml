name: Flutter Frontend Build & Deploy

on:
  push:
    branches: [ "main" ]
    paths:
      - 'shoestorefe/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./shoestorefe

    steps:
    - uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.19.x' # Adjust version as needed

    - name: Install dependencies
      run: flutter pub get

    - name: Build Web
      run: flutter build web --release

    # Deploy to Firebase Hosting
    # Note: User needs to set secret: FIREBASE_SERVICE_ACCOUNT_KEY
    # And have firebase.json in the project root
    - name: Deploy to Firebase
      if: success()
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: ${{ secrets.GITHUB_TOKEN }}
        firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        channelId: live
        projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
        entryPoint: ./shoestorefe

    - name: Build Android APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: shoestore-app-release
        path: shoestorefe/build/app/outputs/flutter-apk/app-release.apk
